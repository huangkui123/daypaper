<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="date">
      <div class="date-main"><span id="d-md"></span><span class="date-week" id="d-week"></span></div>
      <div class="date-sub" id="d-sub"></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="grid">
    <section class="panel todo">
      <div class="panel-head">
        <h2 data-i18n="todo"></h2>
        <span class="count" id="todo-count"></span>
      </div>
      <form id="todo-form" autocomplete="off">
        <input id="todo-input" type="text" data-i18n-ph="addTodo" maxlength="200">
      </form>
      <ul id="todo-list" class="todo-list"></ul>
      <button id="todo-clear" class="link-btn" data-i18n="clearDone" hidden></button>
    </section>

    <section class="panel pad">
      <div class="panel-head">
        <h2 data-i18n="scratch"></h2>
        <span class="count" id="pad-status"></span>
      </div>
      <div class="pad-sheet">
        <textarea id="pad" spellcheck="false" data-i18n-ph="scratchPh"></textarea>
      </div>
    </section>

    <section class="panel cal">
      <div class="panel-head">
        <h2 id="cal-title"></h2>
        <div class="cal-nav">
          <button id="cal-prev" class="icon-btn" data-i18n-label="prevMonth">‹</button>
          <button id="cal-today" class="link-btn" data-i18n="today"></button>
          <button id="cal-next" class="icon-btn" data-i18n-label="nextMonth">›</button>
        </div>
      </div>
      <div class="month">
        <div class="weekdays" id="weekdays"></div>
        <div class="days" id="days"></div>
      </div>

      <div class="agenda">
        <div class="agenda-head">
          <h3 id="agenda-title"></h3>
          <a class="link-btn" id="cal-open" href="https://calendar.google.com/calendar/r" target="_blank" rel="noopener" data-i18n="openCal"></a>
        </div>
        <ul id="agenda-day" class="events"></ul>
        <h3 class="upcoming-title" id="upcoming-title" data-i18n="upcoming"></h3>
        <ul id="agenda-next" class="events"></ul>
        <div id="cal-connect" class="connect" hidden>
          <p id="cal-connect-hint"></p>
          <button id="cal-connect-btn" class="btn"></button>
          <p class="err" id="cal-err"></p>
        </div>
      </div>
    </section>
  </main>

  <button id="settings-btn" class="settings-btn" data-i18n-label="settings">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <dialog id="settings" class="settings">
    <form method="dialog" id="settings-form">
      <h2 data-i18n="settings"></h2>

      <div class="field-row">
        <label for="set-lang" data-i18n="language"></label>
        <select id="set-lang">
          <option value="auto" data-i18n="langAuto"></option>
          <option value="en">English</option>
          <option value="zh">简体中文</option>
        </select>
      </div>
      <div class="field-row">
        <label for="set-week" data-i18n="weekStart"></label>
        <select id="set-week">
          <option value="auto" data-i18n="weekAuto"></option>
          <option value="1" data-i18n="monday"></option>
          <option value="0" data-i18n="sunday"></option>
        </select>
      </div>

      <div class="set-group">
        <div class="set-group-head">
          <h3 data-i18n="calendar"></h3>
          <a id="guide-link" class="link-btn" target="_blank" rel="noopener" data-i18n="guide"></a>
        </div>
        <label class="field">
          <span data-i18n="clientId"></span>
          <input id="set-client" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="clientIdPh">
        </label>
        <div class="field">
          <span data-i18n="redirect"></span>
          <div class="copy-row">
            <code id="redirect-uri"></code>
            <button type="button" id="copy-redirect" class="btn small" data-i18n="copy"></button>
          </div>
          <small data-i18n="redirectHint"></small>
        </div>
        <div class="status-row">
          <span class="status-dot" id="auth-dot"></span>
          <span id="auth-status"></span>
          <button type="button" id="disconnect" class="link-btn" data-i18n="disconnect" hidden></button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="settings-cancel" class="btn" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
